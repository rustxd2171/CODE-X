<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link href="https://cdn.jsdelivr.net/npm/boxicons/css/boxicons.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            color: #ff7200;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        input:focus {
            border-color: #ff7200;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #ff7200;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #e85f00;
        }

        .link {
            text-align: center;
            margin-top: 20px;
        }

        .link a {
            color: #ff7200;
            text-decoration: none;
        }

        .link a:hover {
            text-decoration: underline;
        }

        .liw {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .icons {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .icons a {
            margin: 0 10px;
            color: #ff7200;
            font-size: 20px;
            text-decoration: none;
        }

        .icons a:hover {
            color: #e85f00;
        }
    </style>
</head>
<body>
    <div class="form">
        <h2>Login Here</h2>
        <input type="email" id="email" placeholder="Enter Email Here" required>
        <input type="password" id="password" placeholder="Enter Password Here" required>
        <button class="btnn"> <a href="after.html" style="color: #f5f5f5; text-decoration: none;">Login</a> </button>
        <p class="link" style="color: #121212;">Don't have an account?<br>
            <a href="registerpage.html">Sign up here</a>
        </p>
    </div>
</body>
</html>
