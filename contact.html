<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="contact.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Document</title>
</head>

<body>
    <div class="main">
        <nav class="navbar">
            <div class="icon">
                <h2 class="logo">CODE - X</h2>
            </div>
            <div class="menu">
                <ul id="menuList">
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="about.html">ABOUT</a></li>
                    <li><a href="service.html">SERVICE</a></li>
                    <li><a href="price.html">PRICING</a></li>
                    <li><a href="contact.html">CONTACT</a></li>
                    <button class="mode" id="modeToggle">Dark mode
                        <i class="bx bxs-moon"></i>
                    </button>
                </ul>
                <div class="menu-icon">
                    <i class='bx bx-menu' onclick="toggleMenu()"></i>
                </div>
            </div>
            <div class="search">
                <input class="srch" type="search" name="" placeholder="Type To text">
                <button class="btn" onclick="window.location.href='#'">Search</button>
            </div>
        </nav>
        <!-- Contact Section -->
        <section class="contact-section">
            <h1>Contact Us</h1>
            <p>Have any questions? Feel free to reach out to us!</p>

            <div class="contact-container">
                <!-- Contact Form -->
                <form class="contact-form" action="https://formsubmit.co/nathaniemzinahbizu@gmail.com" method="POST">
                <input type="text"  name="name" placeholder="Your Name" required>
                <input type="email"name="email" placeholder="Your Email" required>
                <input type="text"name="subject" placeholder="Subject" required>
                <textarea name="msg" placeholder="Your Message" rows="5" required></textarea>
                <input type="hidden" name="_captcha" value="false">
                <button type="submit">Send Message</button>
                </form>

                <!-- Contact Info -->
                <div class="contact-info">
                    <h3>Get in Touch</h3>
                    <p><strong>Address:</strong> CMC ,Summit,20-meter </p>
                    <p><strong>Email:</strong> Nathaniem@gmail.com</p>
                    <p><strong>Phone:</strong> +251 975876505</p>
                    <p><strong>Hours:</strong> Mon - Fri, 9 AM - 6 PM</p>
                </div>
            </div>
        </section>
    </div>
    <script>
        let menuList = document.getElementById("menuList")
        menuList.style.maxHeight = "0px";

        function toggleMenu() {
            if (menuList.style.maxHeight == "0px") {
                menuList.style.maxHeight = "300px";
            }
            else {
                menuList.style.maxHeight = "0px";
            }
        }
    </script>
    <script>
        // Select the button
        const modeToggle = document.getElementById('modeToggle');

        // Add event listener to toggle the mode
        modeToggle.addEventListener('click', () => {
            // Toggle the "dark-mode" class on the body
            document.body.classList.toggle('dark-mode');

            // Update button text and icon based on the current mode
            if (document.body.classList.contains('dark-mode')) {
                modeToggle.innerHTML = 'Light Mode <i class="bx bxs-sun"></i>'; // Switch to light mode icon and text
            } else {
                modeToggle.innerHTML = 'Dark Mode <i class="bx bxs-moon"></i>'; // Switch to dark mode icon and text
            }
            // Toggle the color of the paragraph text
            if (document.body.classList.contains('dark-mode')) {
                text.style.color = "lightblue"; // Set paragraph text color to light blue in dark mode
            } else {
                text.style.color = "black"; // Reset to black in light mode
            }
        });
    </script>
</body>

</html>
